name: Transfer Pak host tests and PS3 package

on:
  pull_request:
    branches: [main]
    paths:
      # Core files that implement or integrate the Transfer Pak in Joybus/state handling.
      - "src/core/pif.c"
      - "src/core/pif.h"
      - "src/core/state.c"
      - "src/core/transferpak.c"
      - "src/core/transferpak.h"
      # Frontend accessory selection, ROM/save file support, and its build/strings.
      - "src/frontend/Makefile"
      - "src/frontend/i18n.c"
      - "src/frontend/menu.c"
      - "src/frontend/menu.h"
      - "src/frontend/transferpakfile.c"
      - "src/frontend/transferpakfile.h"
      # Tests that cover the shared integration points and Transfer Pak behavior.
      - "tests/unit/Makefile"
      - "tests/unit/test.c"
      - "tests/unit/test.h"
      - "tests/unit/test_menu.c"
      - "tests/unit/test_pif.c"
      - "tests/unit/test_transferpak.c"
      - "docs/transferpak.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: transfer-pak-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests-and-ps3-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select existing PS3 toolchain image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/kadorna1/salsa64-toolchain:10ba33a3a3733eaa"
          echo "SALSA64_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "Reusing published toolchain image: $IMAGE"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the existing PS3 toolchain image
        run: docker pull "$SALSA64_IMAGE"

      - name: Run host regression suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          tools/build.sh test-host 2>&1 | tee build/logs/transferpak-host-tests.log

      - name: Build PS3 PKG
        shell: bash
        run: |
          set -euo pipefail
          tools/build.sh -C src/frontend pkg 2>&1 | tee build/logs/transferpak-ps3-package.log
          test -s build/salsa64/salsa64.pkg

      - name: Upload package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salsa64-transferpak-build
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/salsa64/salsa64.pkg
            build/salsa64/salsa64.elf
            build/salsa64/salsa64.self
            build/logs/transferpak-host-tests.log
            build/logs/transferpak-ps3-package.log
