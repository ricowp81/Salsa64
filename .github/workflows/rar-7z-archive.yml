name: RAR and 7z archive build

on:
  pull_request:
    branches: [main]
    paths:
      - "src/frontend/**"
      - "third_party/**"
      - ".gitmodules"
      - "tests/unit/**"
      - "mk/ps3.mk"
      - "tools/build.sh"
      - "tools/ci-build-version.py"
      - "CHANGELOG.md"
      - ".github/workflows/rar-7z-archive.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: rar-7z-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests-and-ps3-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Check out source and pinned archive libraries
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Derive release version and incremental build letter
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:CHANGELOG.md > "$RUNNER_TEMP/Salsa64-main-CHANGELOG.md"
          BUILD_VERSION="$(python3 tools/ci-build-version.py "$GITHUB_RUN_NUMBER" --changelog "$RUNNER_TEMP/Salsa64-main-CHANGELOG.md")"
          if ! [[ "$BUILD_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+[a-z]+$ ]]; then
            echo "Invalid derived build version: $BUILD_VERSION" >&2
            exit 1
          fi
          {
            echo "BUILD_VERSION=$BUILD_VERSION"
            echo "SALSA64_VERSION=$BUILD_VERSION"
            echo "SALSA64_COMMIT=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_ENV"
          echo "Building Salsa64 $BUILD_VERSION (main changelog + workflow run $GITHUB_RUN_NUMBER)"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse or build the current PS3 toolchain image
        shell: bash
        run: |
          set -euo pipefail
          DOCKERFILE_HASH="$(sha256sum docker/Dockerfile | cut -c1-16)"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/salsa64-toolchain:$DOCKERFILE_HASH"
          COMPAT_IMAGE="ghcr.io/kadorna1/salsa64-toolchain:f24becb301d65113"
          if docker pull "$IMAGE"; then
            if docker run --rm "$IMAGE" sh -c 'test -s "$PS3DEV/portlibs/ppu/include/zlib.h" && test -s "$PS3DEV/portlibs/ppu/lib/libz.a"'; then
              echo "SALSA64_IMAGE=$IMAGE" >> "$GITHUB_ENV"
              echo "Using cached toolchain image: $IMAGE"
              exit 0
            fi
            echo "Cached image lacks PPU zlib; checking compatibility cache."
          else
            echo "No exact Dockerfile image for hash $DOCKERFILE_HASH; checking compatibility cache."
          fi
          if docker pull "$COMPAT_IMAGE"; then
            if docker run --rm "$COMPAT_IMAGE" sh -c 'test -s "$PS3DEV/portlibs/ppu/include/zlib.h" && test -s "$PS3DEV/portlibs/ppu/lib/libz.a"'; then
              echo "SALSA64_IMAGE=$COMPAT_IMAGE" >> "$GITHUB_ENV"
              echo "Using compatible cached toolchain image: $COMPAT_IMAGE"
              exit 0
            fi
          fi
          echo "No usable cached image; building current toolchain image."
          echo "SALSA64_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          SALSA64_IMAGE="$IMAGE" tools/docker-image.sh
          docker run --rm "$IMAGE" sh -c 'test -s "$PS3DEV/portlibs/ppu/include/zlib.h" && test -s "$PS3DEV/portlibs/ppu/lib/libz.a"'
          docker push "$IMAGE"

      - name: Install host zlib headers
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev

      - name: Run host regression suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          make test-host 2>&1 | tee build/logs/rar-7z-host-tests.log

      - name: Build installable PS3 PKG
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build.sh -C src/frontend pkg 2>&1 | tee build/logs/rar-7z-ps3-package.log
          test -s build/salsa64/salsa64.pkg
          cp build/salsa64/salsa64.pkg "build/salsa64/salsa64-${BUILD_VERSION}.pkg"
          test -s "build/salsa64/salsa64-${BUILD_VERSION}.pkg"

      - name: Upload package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salsa64-rar7z-${{ env.BUILD_VERSION || format('run-{0}', github.run_number) }}
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
          path: |
            build/salsa64/salsa64-${{ env.BUILD_VERSION }}.pkg
            build/logs/docker-image.log
            build/logs/rar-7z-host-tests.log
            build/logs/rar-7z-ps3-package.log
